async function delC(u,id){
  const list=((S.comments[u]||{}).list||[]).filter(c=>c.id!==id);
  try{await db.doc('comments/'+u).set({list})}catch(e){toast('삭제하지 못했습니다')}
}
async function pubPost(){
  const t=(S.drafts['d-t']||'').trim(),b=(S.drafts['d-b']||'').trim(),im=S.drafts['d-imgs']||[];let poll=null;
  if(S.drafts['d-pl']){const q=(S.drafts['d-pq']||'').trim(),o=(S.drafts['d-po']||'').split('\n').map(x=>x.trim()).filter(Boolean);
    if(!q||o.length<2||o.length>6)return toast('투표 질문과 선택지 2~6개가 필요합니다');poll={q,opts:o}}
  if(!t&&!b&&!im.length&&!poll)return toast('제목, 내용, 이미지, 투표 중 하나는 입력해 주세요');
  try{await db.collection('posts').add({title:t,body:b,imgs:im,ts:Date.now(),uid:S.me,bid:S.view,...(poll?{poll}:{})});
    Object.assign(S.drafts,{'d-t':'','d-b':'','d-imgs':[],'d-pl':false,'d-pq':'','d-po':''});S.up.clear();S.adm=null;render()}catch(e){toast('저장하지 못했습니다')}
}
async function pubNotice(){
  const t=(S.drafts['d-nt']||'').trim(),b=(S.drafts['d-nb']||'').trim();
  if(!t||!b)return toast('제목과 내용을 입력해 주세요');
  try{await db.collection('notices').add({title:t,body:b,ts:Date.now()});S.drafts['d-nt']=S.drafts['d-nb']='';S.nadm=false;render()}catch(e){toast('저장하지 못했습니다')}
}
async function pubLink(){
  const t=(S.drafts['d-lt']||'').trim();let u=(S.drafts['d-lu']||'').trim();
  if(u&&!/^[a-z][a-z0-9+.-]*:\/\//i.test(u))u='https://'+u;
  const x=safeUrl(u);
  if(!t||!x)return toast('이름과 올바른 주소(http, https)를 입력해 주세요');
  try{await db.collection('links').add({title:t,url:x,ts:Date.now()});S.drafts['d-lt']=S.drafts['d-lu']='';S.ladm=false;render()}catch(e){toast('저장하지 못했습니다')}
}

addEventListener('click',e=>{if(S.pick&&!e.target.closest('.rx')){S.pick=null;render()}});
let first=true;
const parseView=()=>{const x=/^#b-([A-Za-z0-9]+)$/.exec(location.hash),y=/^#p-([A-Za-z0-9]+)$/.exec(location.hash);return ({'#about':'about','#library':'library','#report':'report','#nova':'nova'})[location.hash]||(x?x[1]:y?'p:'+y[1]:'home')};
const route=async()=>{const v=parseView();if(v!==S.view){S.edit=null;S.adm=null;S.rep=null;S.pick=null;S.zoom=null;S.cedit=null;S.aedit=false;S.libadd=false}
 
  if(first||v===S.view||matchMedia('(prefers-reduced-motion:reduce)').matches){first=false;S.view=v;await render();scrollTo(0,0);return}
  $.classList.add('out');await new Promise(r=>setTimeout(r,200));S.view=v;await render();scrollTo(0,0);$.classList.remove('out')};
addEventListener('hashchange',route);route();

(async()=>{
  const[d,u,a]=await Promise.all([use('db'),use('user'),use('assets')]);
  db=d;user=u;assets=a;
  S.owner=u?await u.isOwner():false;
  S.me=u?await u.id():null;
  const cw=u?await u.can('data.write'):null;
  S.canWrite=!!db&&!!S.me&&cw!==false;
  if(!db){S.ready=true;return render()}
  setTimeout(()=>{if(!S.ready){S.slow=true;render()}},10000);
  let comp=false,pend=false,ct=0,rt=0;
  const flush=()=>{if(!comp&&pend){pend=false;clearTimeout(rt);rt=setTimeout(render,90)}};
  addEventListener('compositionstart',()=>{comp=true;clearTimeout(ct)},true);
  addEventListener('compositionend',()=>{comp=false;clearTimeout(ct);ct=setTimeout(flush,700)},true);
  const soft=()=>{if(comp){pend=true;return}clearTimeout(rt);rt=setTimeout(render,90)};
  const sub=(c,f)=>db.collection(c).onSnapshot(s=>{f(s);S.ready=true;soft()},e=>{S.ready=true;soft()});
  sub('posts',s=>S.posts=s.docs.map(x=>({id:x.id,...x.data()})));
  sub('polls',s=>S.polls=s.docs.map(x=>({id:x.id,...x.data()})));
  sub('votes',s=>{S.votes={};s.docs.forEach(x=>S.votes[x.id]=x.data())});
  sub('comments',s=>{S.comments={};s.docs.forEach(x=>S.comments[x.id]=x.data())});
  sub('nicks',s=>{S.nicks={};s.docs.forEach(x=>S.nicks[x.id]=x.data())});
  sub('notices',s=>S.notices=s.docs.map(x=>({id:x.id,...x.data()})));
  sub('links',s=>S.links=s.docs.map(x=>({id:x.id,...x.data()})));
  sub('reacts',s=>{S.reacts={};s.docs.forEach(x=>S.reacts[x.id]=x.data())});
  sub('boards',s=>{S.boards={};s.docs.forEach(x=>S.boards[x.id]=x.data());S.bready=true});
  sub('settings',s=>{S.site={};S.about={};s.docs.forEach(x=>{if(x.id==='site')S.site=x.data();if(x.id==='about')S.about=x.data()})});
  sub('library',s=>S.library=s.docs.map(x=>({id:x.id,...x.data()})));
  sub('reports',s=>{S.reports={};s.docs.forEach(x=>S.reports[x.id]=x.data())});
})();
</script>
